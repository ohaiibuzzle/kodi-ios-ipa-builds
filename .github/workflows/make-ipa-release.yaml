name: Make Kodi iOS IPA from Kodi.tv
on:
    workflow_dispatch:
        inputs:
            version:
                description: "Kodi version to build (e.g. 19.4)"
                required: true
                default: "21.3"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Fetch deb package from remote
              run: |
                  VERSION=${{ github.event.inputs.version }}
                  curl -L -o kodi.ipa https://mirrors.kodi.tv/releases/darwin/ios-arm64/org.xbmc.kodi-ios_${VERSION}_iphoneos-arm64.deb
            - name: Extract app bundle from deb
              run: |
                mkdir -p extract
                dpkg-deb -x kodi.ipa extract
            - name: Package app bundle to iOS IPA
              run: |
                mkdir Payload
                mv extract/Applications/Kodi.app Payload/
                zip -r Kodi-iOS.ipa Payload
            - name: Create release and upload IPA
              uses: ncipollo/release-action@v1
              id: create_release
              with:
                draft: false
                prerelease: false
                tag: v${{ github.event.inputs.version }}-${{ github.run_id }}
                name: Kodi iOS ${{ github.event.inputs.version }}-${{ github.run_id }}
                body: "Kodi iOS ${{ github.event.inputs.version }} release created from Kodi.tv deb package."
                artifacts: Kodi-iOS.ipa
                makeLatest: true
                skipIfReleaseExists: true